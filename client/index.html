<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日色彩记忆挑战</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🎨 每日色彩记忆挑战</h1>

    <div id="challenge-date" class="challenge-date">加载中...</div>

    <div class="scores">
      <div class="score-item">
        <span class="score-label">当前关卡</span>
        <span id="current-level" class="score-value">0</span>
      </div>
      <div class="score-item highlight">
        <span class="score-label">今日最佳</span>
        <span id="today-best" class="score-value">0</span>
      </div>
      <div class="score-item">
        <span class="score-label">历史最高</span>
        <span id="high-score" class="score-value">0</span>
      </div>
    </div>

    <div id="game-status" class="game-status">点击开始按钮开始今日挑战</div>

    <div class="game-board">
      <button class="color-btn red" data-color="red"></button>
      <button class="color-btn yellow" data-color="yellow"></button>
      <button class="color-btn blue" data-color="blue"></button>
      <button class="color-btn green" data-color="green"></button>
    </div>

    <div class="controls">
      <button id="start-btn" class="start-btn">开始挑战</button>
    </div>

    <div class="instructions">
      <h3>游戏规则</h3>
      <p>1. 每天有固定的颜色序列，全天不变</p>
      <p>2. 观察亮起的按钮顺序</p>
      <p>3. 按相同顺序点击按钮</p>
      <p>4. 每过一关，序列增加一个</p>
      <p>5. 当天多次挑战，只记录最佳成绩</p>
    </div>
  </div>

  <script type="module" src="game.ts"></script>
</body>
</html>
